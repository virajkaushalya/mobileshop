name: React Native CI

on:
  push:
    branches: [main, develop, M-Init]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: mobileshop/package-lock.json

      - name: Install dependencies
        working-directory: mobileshop
        run: cd mobileshop && npm ci

      - run: cd mobileshop && npm run lint

      # Uncomment if have tests
      # - run: npm test
